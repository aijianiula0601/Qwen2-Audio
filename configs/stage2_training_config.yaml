# Stage 2: Audio Understanding & Description Training Configuration

# Model Configuration
model:
  llama_model_name: "meta-llama/Llama-3.3-70B-Instruct"
  whisper_model_name: "openai/whisper-large-v3"
  freeze_llm: false  # Stage 2: Start training LLM with LoRA
  freeze_audio_encoder: true  # Keep audio encoder frozen after Stage 1
  use_lora: true  # Use LoRA for efficient LLM fine-tuning
  lora_rank: 64
  lora_alpha: 16
  lora_dropout: 0.1
  use_cross_attention: true  # Enable cross-attention for better understanding
  max_audio_tokens: 2048  # Larger for understanding tasks
  audio_adapter_hidden_size: 2048
  use_conv_adapter: true

# Stage 2 Specific Training Configuration
training:
  # Data paths
  train_data_path: "data/stage2_understanding/train.jsonl"
  val_data_path: "data/stage2_understanding/val.jsonl"
  
  # Training parameters
  num_epochs: 3  # More epochs for understanding
  batch_size: 8  # Smaller batch due to longer sequences
  eval_batch_size: 4
  learning_rate: 2e-5  # Lower LR for LLM fine-tuning
  weight_decay: 0.01
  warmup_ratio: 0.1
  
  # Audio and text limits
  max_text_length: 512  # Longer for descriptions
  max_audio_length: 30.0  # 30 seconds for richer content
  
  # Optimization
  optimizer_type: "adamw"
  scheduler_type: "cosine_with_warmup"
  gradient_accumulation_steps: 4  # Larger accumulation
  max_grad_norm: 1.0
  
  # Logging and checkpointing
  log_interval: 100
  save_interval: 1000
  eval_interval: 500
  early_stopping_patience: 5
  
  # System
  num_workers: 6
  seed: 42
  
  # Mixed precision
  fp16: true
  bf16: false

# DeepSpeed Configuration for Stage 2
deepspeed:
  enabled: true
  config_path: "configs/deepspeed_stage2_config.json"
  zero_stage: 2

# Output Configuration
output:
  output_dir: "outputs/stage2_understanding"
  experiment_name: "llama_audio_stage2"
  save_total_limit: 3
  
# Distributed Training
distributed:
  backend: "nccl"
  find_unused_parameters: false

# Evaluation Configuration
evaluation:
  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps" 
  save_steps: 1000
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  load_best_model_at_end: true

# Data Configuration
data:
  audio_format: "whisper"
  sample_rate: 16000
  include_audio_tokens: true
  instruction_templates:
    - "请描述这段音频的内容：<audio>"
    - "这段音频中有什么？<audio>"
    - "分析这段音频：<audio>"
    - "听这段音频并描述：<audio>"
    - "<audio> 这段音频包含什么声音？"
    - "<audio> 描述你听到的内容。"

# Stage 2 Loss Configuration
loss:
  # Focus on generation loss
  generation_weight: 1.0
  label_smoothing: 0.1

# Model Loading
model_loading:
  # Load from Stage 1 checkpoint
  load_audio_encoder_from: "outputs/stage1_alignment/final_model"
  load_connector_from: "outputs/stage1_alignment/final_model"
  init_llm_from_pretrained: true

# Resume Training
resume:
  resume_from_checkpoint: null
  auto_find_batch_size: false

# Stage 2 Notes
stage_info:
  stage: 2
  objective: "Audio understanding and description generation"
  frozen_components: ["audio_encoder"]
  trainable_components: ["multimodal_connector", "llm_with_lora"]
  expected_metrics:
    - "Audio description quality"
    - "Content understanding accuracy"
    - "BLEU/ROUGE scores"
  next_stage: "stage3_conversation"
  prerequisite: "Complete Stage 1 training first" 