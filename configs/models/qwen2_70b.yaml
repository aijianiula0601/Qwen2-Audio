# Qwen2-70B specific configuration
model:
  llm_backbone:
    model_name: "Qwen/Qwen2-70B"
    model_type: "qwen2"
    hidden_size: 8192
    num_attention_heads: 64
    num_hidden_layers: 80
    vocab_size: 151936
    max_position_embeddings: 131072
    freeze_llm: false
    
  audio_encoder:
    model_name: "openai/whisper-large-v3"
    freeze_encoder: false
    freeze_layers: []
    
  # Audio projector adapted for Qwen2-70B
  audio_projector:
    input_size: 1280  # Whisper-large-v3 feature size
    hidden_size: 8192  # Match Qwen2-70B hidden size
    intermediate_size: 32768
    num_layers: 3  # More layers for larger model
    
  special_tokens:
    audio_start_token: "<|audio_bos|>"
    audio_end_token: "<|audio_eos|>"
    pad_token: "<|endoftext|>"
    
training:
  hyperparameters:
    per_device_train_batch_size: 1  # Very small for 70B model
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 16
    learning_rate: 5e-6  # Lower learning rate for larger model
    weight_decay: 0.1
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    num_train_epochs: 3
    max_steps: -1
    eval_steps: 1000
    save_steps: 1000
    logging_steps: 1  # Log every step
    evaluation_strategy: "steps"
    save_strategy: "steps"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    report_to: ["tensorboard"]
    logging_dir: "tensorboard/pretrain_qwen2_70b"
    dataloader_num_workers: 4
    bf16: true
    tf32: true
    gradient_checkpointing: true
    group_by_length: true
    remove_unused_columns: false
  deepspeed:
    enabled: true
    config_file: "configs/deepspeed_70b_config.json" 