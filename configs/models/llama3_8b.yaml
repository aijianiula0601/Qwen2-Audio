# LLaMA-3-8B specific configuration
model:
  llm_backbone:
    model_name: "meta-llama/Meta-Llama-3-8B"
    model_type: "llama3"
    hidden_size: 4096
    num_attention_heads: 32
    num_hidden_layers: 32
    vocab_size: 128256
    max_position_embeddings: 8192
    
  # Audio projector adapted for LLaMA-3-8B
  audio_projector:
    input_size: 1280  # Whisper-large-v3 feature size
    hidden_size: 4096  # Match LLaMA-3-8B hidden size
    intermediate_size: 16384
    num_layers: 2
    
  # Special tokens for LLaMA-3
  special_tokens:
    audio_start_token: "<|audio_start|>"
    audio_end_token: "<|audio_end|>"
    pad_token: "<|pad|>"
    
training:
  hyperparameters:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 1e-5 