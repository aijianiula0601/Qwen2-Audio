# LLaMA-3-8B specific configuration
model:
  llm_backbone:
    model_name: "meta-llama/Meta-Llama-3-8B"
    model_type: "llama3"
    hidden_size: 4096
    num_attention_heads: 32
    num_hidden_layers: 32
    vocab_size: 128256
    max_position_embeddings: 8192
    freeze_llm: false
    
  audio_encoder:
    model_name: "openai/whisper-large-v3"
    freeze_encoder: false
    freeze_layers: []
    
  # Audio projector adapted for LLaMA-3-8B
  audio_projector:
    input_size: 1280  # Whisper-large-v3 feature size
    hidden_size: 4096  # Match LLaMA-3-8B hidden size
    intermediate_size: 16384
    num_layers: 2
    
  # Special tokens for LLaMA-3
  special_tokens:
    audio_start_token: "<|audio_start|>"
    audio_end_token: "<|audio_end|>"
    pad_token: "<|pad|>"
    
training:
  hyperparameters:
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 1e-5
    weight_decay: 0.1
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    num_train_epochs: 3
    max_steps: -1
    eval_steps: 1000
    save_steps: 1000
    logging_steps: 1  # Log every step
    evaluation_strategy: "steps"
    save_strategy: "steps"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    report_to: ["tensorboard"]
    logging_dir: "tensorboard/pretrain_llama3_8b"
    dataloader_num_workers: 4
    bf16: true
    tf32: true
    gradient_checkpointing: true
    group_by_length: true
    remove_unused_columns: false
  deepspeed:
    enabled: true
    config_file: "configs/deepspeed_config.json" 