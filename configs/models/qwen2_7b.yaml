# Qwen2-7B specific configuration
model:
  llm_backbone:
    model_name: "Qwen/Qwen2-7B"
    model_type: "qwen2"
    hidden_size: 3584
    num_attention_heads: 28
    num_hidden_layers: 28
    vocab_size: 151936
    max_position_embeddings: 131072
    
  # Audio projector adapted for Qwen2-7B
  audio_projector:
    input_size: 1280  # Whisper-large-v3 feature size
    hidden_size: 3584  # Match Qwen2-7B hidden size
    intermediate_size: 14336
    num_layers: 2
    
training:
  hyperparameters:
    per_device_train_batch_size: 2  # Smaller for 7B model
    gradient_accumulation_steps: 8
    learning_rate: 1e-5 