# Qwen2-Audio Base Configuration
# Supports multiple LLM backbones and three-stage training process

model:
  # Audio encoder configuration (Whisper-large-v3)
  audio_encoder:
    model_name: "openai/whisper-large-v3"
    freeze_encoder: false
    freeze_layers: []  # List of layer indices to freeze, empty means no freezing
    
  # LLM backbone configuration - supports multiple models
  llm_backbone:
    model_name: "Qwen/Qwen2-7B"  # Default, can be changed to Qwen2-70B, Meta-Llama-3-8B, etc.
    model_type: "qwen2"  # qwen2, llama3, etc.
    freeze_llm: false
    
  # Audio projector configuration
  audio_projector:
    hidden_size: 1024
    intermediate_size: 4096
    num_layers: 2
    
  # Special tokens
  special_tokens:
    audio_start_token: "<|audio_bos|>"
    audio_end_token: "<|audio_eos|>"
    pad_token: "<|endoftext|>"

# Training configuration
training:
  # Three-stage training process
  stage: "pretrain"  # pretrain, sft, dpo
  
  # Data configuration
  data:
    max_audio_length: 30.0  # seconds
    max_text_length: 2048
    sample_rate: 16000
    
  # Training hyperparameters
  hyperparameters:
    learning_rate: 1e-5
    weight_decay: 0.1
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    
    # Stage-specific learning rates
    stage_lr:
      pretrain: 1e-5
      sft: 5e-6
      dpo: 1e-6
    
    # Batch size configuration
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 2
    
    # Training epochs/steps
    num_train_epochs: 3
    max_steps: -1
    
    # Evaluation
    evaluation_strategy: "steps"
    eval_steps: 1000
    save_steps: 1000
    logging_steps: 100
    
  # DeepSpeed configuration
  deepspeed:
    enabled: true
    config_file: "configs/deepspeed_config.json"
    
# Data paths
data_paths:
  # Pre-training data
  pretrain:
    datasets:
      # - name: "air_bench_pretrain"
      #   path: "data/pretrain/air_bench"
      #   weight: 1.0
      # - name: "common_voice"
      #   path: "data/pretrain/common_voice"
      #   weight: 0.5
      - name: "librispeech"
        path: "data/pretrain/librispeech"
        weight: 0.8
        
  # SFT data
  sft:
    datasets:
      - name: "air_bench_sft"
        path: "data/sft/air_bench"
        weight: 1.0
      - name: "alpaca_audio"
        path: "data/sft/alpaca_audio"
        weight: 0.8
        
  # DPO data
  dpo:
    datasets:
      - name: "air_bench_dpo"
        path: "data/dpo/air_bench"
        weight: 1.0

# Hardware configuration
hardware:
  num_gpus: 8
  gpu_memory_fraction: 0.9
  mixed_precision: "bf16"
  
# Logging and checkpointing
logging:
  output_dir: "outputs"
  run_name: "qwen2_audio_experiment"
  # wandb_project: "qwen2_audio"
  # wandb_entity: null
  
checkpointing:
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false 